<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1020" width="390" height="1020">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
    </style>
  </defs>
  <rect width="390" height="1020" fill="#FFFFFF"/>
  <!-- Mobile Header (390px) -->
  <g id="Mobile-Header">
    <rect width="390" height="36" fill="#0F2238"/>
    <text x="16" y="23" fill="#FCA5A5" font-family="'Inter', sans-serif" font-size="11" font-weight="700">24/7 EMERGENCY</text>
    <text x="374" y="23" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="end">(555) 014-7824</text>
    
    <rect y="36" width="390" height="64" fill="#FFFFFF"/>
    <line x1="0" y1="100" x2="390" y2="100" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Logo -->
    <g transform="translate(16, 48)">
      <rect width="32" height="32" rx="6" fill="#0F2238"/>
      <polygon points="16 8 18 13 23 13.5 19 17 20.5 22 16 19.5 11.5 22 13 17 9 13.5 14 13 16 8" fill="#FFFFFF"/>
      <text x="40" y="18" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800">NorthStar HVAC</text>
      <text x="40" y="30" fill="#E65100" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">COMFORT YOU CAN COUNT ON</text>
    </g>

    <!-- Call & Menu Action Buttons (Official Lucide Phone & Menu from Iconify) -->
    <g transform="translate(286, 48)">
      <!-- Quick Call Button (36x36 with Lucide Phone) -->
      <rect width="36" height="36" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <svg x="8" y="8" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>

      <!-- Hamburger Menu Button (36x36 with Lucide Menu) -->
      <g transform="translate(44, 0)">
        <rect width="36" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <svg x="8" y="8" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F2238" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" x2="20" y1="12" y2="12"/>
          <line x1="4" x2="20" y1="6" y2="6"/>
          <line x1="4" x2="20" y1="18" y2="18"/>
        </svg>
      </g>
    </g>
  </g>
  <g id="Hero" transform="translate(16, 120)">
    <text x="0" y="14" fill="#E65100" font-family="'Inter', sans-serif" font-size="11" font-weight="700">STEP 1 OF 4</text>
    <text x="0" y="44" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800">Choose Your Service</text>
  </g>

  <!-- Mobile Service Chips -->
  <g id="Chips" transform="translate(16, 190)">
    <g transform="translate(0, 0)">
      <rect width="358" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
      <text x="16" y="35" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">AC Repair</text>
      <text x="342" y="35" fill="#2563EB" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="end">✓ SELECTED</text>
    </g>

    <g transform="translate(0, 70)">
      <rect width="358" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="16" y="35" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">AC Installation</text>
    </g>

    <g transform="translate(0, 140)">
      <rect width="358" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="16" y="35" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Heating &amp; Furnace Repair</text>
    </g>

    <g transform="translate(0, 210)">
      <rect width="358" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="16" y="35" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Preventive Maintenance</text>
    </g>

    <g transform="translate(0, 280)">
      <rect width="358" height="60" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
      <text x="16" y="35" fill="#DC2626" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">24/7 Emergency Dispatch</text>
    </g>

    <g transform="translate(0, 360)">
      <rect width="358" height="48" rx="8" fill="#E65100"/>
      <text x="179" y="29" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Continue to Date →</text>
    </g>
  </g>

  <!-- Mobile Footer (Y: 640) -->
  <g id="Mobile-Footer" transform="translate(0, 640)">
    <rect width="390" height="380" fill="#0A1829"/>
    <g transform="translate(16, 32)">
      <text x="0" y="20" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="800">NorthStar HVAC Services</text>
      <text x="0" y="44" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">
        <tspan x="0" dy="0">Professional residential and commercial</tspan>
        <tspan x="0" dy="18">heating and cooling service.</tspan>
      </text>

      <text x="0" y="96" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Call 24/7: (555) 014-7824</text>
      <text x="0" y="118" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">hello@northstarhvac.example</text>

      <line x1="0" y1="140" x2="358" y2="140" stroke="#1E293B" stroke-width="1"/>

      <!-- Nav links -->
      <g transform="translate(0, 165)">
        <text x="0" y="14" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Quick Links</text>
        <text x="0" y="38" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Services Directory • Emergency HVAC</text>
        <text x="0" y="58" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Service Areas • Financing Plans</text>
        <text x="0" y="78" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Customer Reviews • Book Service</text>
      </g>

      <line x1="0" y1="270" x2="358" y2="270" stroke="#1E293B" stroke-width="1"/>
      <text x="0" y="295" fill="#64748B" font-family="'Inter', sans-serif" font-size="11">
        <tspan x="0" dy="0">© 2026 NorthStar HVAC Services.</tspan>
        <tspan x="0" dy="16">Fictional business website UI design.</tspan>
      </text>
    </g>
  </g>
</svg>