<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 834 2600" width="834" height="2600" fill="none">
  <!-- NorthStar HVAC: TABLET RESPONSIVE ARTBOARD (834px Viewport) -->
  <rect width="834" height="2600" fill="#F8FAFC"/>

  <!-- 1. Tablet Utility Bar -->
  <g transform="translate(0, 0)">
    <rect width="834" height="40" fill="#0A1829"/>
    <circle cx="32" cy="20" r="3.5" fill="#EF4444"/>
    <text x="44" y="24" fill="#F87171" font-family="'Inter', sans-serif" font-size="11" font-weight="700">24/7 EMERGENCY DISPATCH</text>
    <text x="560" y="24" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Serving Metro Region • (555) 014-7824</text>
  </g>

  <!-- 2. Tablet Header Nav -->
  <g transform="translate(0, 40)">
    <rect width="834" height="76" fill="#FFFFFF"/>
    <line x1="0" y1="75.5" x2="834" y2="75.5" stroke="#E2E8F0" stroke-width="1"/>

    <g transform="translate(32, 16)">
      <rect width="44" height="44" rx="8" fill="#0F2238"/>
      <path d="M22 8L24 19L35 22L24 25L22 36L20 25L9 22L20 19L22 8Z" fill="#FFFFFF"/>
      <circle cx="22" cy="22" r="2.5" fill="#E65100"/>
      <text x="54" y="25" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">NorthStar</text>
      <text x="138" y="25" fill="#E65100" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">HVAC</text>
    </g>

    <!-- Tablet Navigation Links -->
    <g transform="translate(290, 32)">
      <text x="0" y="14" fill="#0F2238" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Services</text>
      <text x="75" y="14" fill="#475569" font-family="'Inter', sans-serif" font-size="14" font-weight="500">About</text>
      <text x="135" y="14" fill="#475569" font-family="'Inter', sans-serif" font-size="14" font-weight="500">Areas</text>
      <text x="195" y="14" fill="#475569" font-family="'Inter', sans-serif" font-size="14" font-weight="500">Financing</text>
      <text x="280" y="14" fill="#475569" font-family="'Inter', sans-serif" font-size="14" font-weight="500">Reviews</text>
    </g>

    <g transform="translate(670, 16)">
      <rect width="132" height="44" rx="8" fill="#E65100"/>
      <text x="66" y="27" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Book Service</text>
    </g>
  </g>

  <!-- 3. Tablet Hero Section (Stacked 2 Columns) -->
  <g id="Tablet-Hero" transform="translate(32, 140)">
    <rect width="770" height="460" rx="16" fill="#0F2238"/>
    <g transform="translate(40, 40)">
      <rect width="250" height="26" rx="13" fill="#1E3A5F"/>
      <circle cx="12" cy="13" r="3.5" fill="#E65100"/>
      <text x="24" y="17" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">RESIDENTIAL &amp; COMMERCIAL HVAC</text>

      <text x="0" y="75" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800">
        <tspan x="0" dy="0">Reliable HVAC Service</tspan>
        <tspan x="0" dy="44">When You Need It Most.</tspan>
      </text>

      <text x="0" y="185" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="15" font-weight="400">
        <tspan x="0" dy="0">From emergency heating repairs to AC installations,</tspan>
        <tspan x="0" dy="22">NorthStar keeps your home comfortable year-round.</tspan>
      </text>

      <!-- Action Buttons -->
      <g transform="translate(0, 245)">
        <rect width="170" height="48" rx="8" fill="#E65100"/>
        <text x="85" y="29" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Book a Service</text>

        <g transform="translate(185, 0)">
          <rect width="190" height="48" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
          <text x="95" y="29" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Call (555) 014-7824</text>
        </g>
      </g>
    </g>
  </g>

  <!-- 4. Tablet Trust Signals (4 Across Grid) -->
  <g transform="translate(32, 630)">
    <rect width="770" height="80" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <g transform="translate(24, 28)">
      <text x="0" y="16" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">• Licensed &amp; Insured</text>
      <text x="180" y="16" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">• 24/7 Emergency</text>
      <text x="360" y="16" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">• 10+ Years Exp.</text>
      <text x="540" y="16" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">• 4.9/5 Rating (650+)</text>
    </g>
  </g>

  <!-- 5. Tablet Services (2 Columns x 3 Rows Grid) -->
  <g id="Tablet-Services" transform="translate(32, 740)">
    <text x="0" y="16" fill="#E65100" font-family="'Inter', sans-serif" font-size="12" font-weight="700">EXPERTISE</text>
    <text x="0" y="48" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800">HVAC Services for Every Season</text>

    <g transform="translate(0, 75)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="370" height="190" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <rect x="20" y="20" width="36" height="36" rx="6" fill="#EFF6FF"/>
        <path d="M38 26V46M28 36H48" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
        <text x="66" y="44" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">AC Repair</text>
        <text x="20" y="76" fill="#475569" font-family="'Inter', sans-serif" font-size="13">
          <tspan x="20" dy="0">Fast diagnostics for warm air,</tspan>
          <tspan x="20" dy="20">strange noises, and refrigerant leaks.</tspan>
        </text>
        <text x="20" y="145" fill="#0F2238" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Learn More →</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(400, 0)">
        <rect width="370" height="190" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <rect x="20" y="20" width="36" height="36" rx="6" fill="#ECFDF5"/>
        <path d="M28 38L38 28L48 38" stroke="#059669" stroke-width="2"/>
        <text x="66" y="44" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">AC Installation</text>
        <text x="20" y="76" fill="#475569" font-family="'Inter', sans-serif" font-size="13">
          <tspan x="20" dy="0">High-efficiency central AC and</tspan>
          <tspan x="20" dy="20">heat pumps sized for peak savings.</tspan>
        </text>
        <text x="20" y="145" fill="#0F2238" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Learn More →</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(0, 215)">
        <rect width="370" height="190" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <rect x="20" y="20" width="36" height="36" rx="6" fill="#FFF7ED"/>
        <path d="M38 26C38 26 32 32 32 37C32 40 34.7 42 38 42C41.3 42 44 40 44 37C44 32 38 26 38 26Z" stroke="#EA580C" stroke-width="2"/>
        <text x="66" y="44" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Heating &amp; Furnace Repair</text>
        <text x="20" y="76" fill="#475569" font-family="'Inter', sans-serif" font-size="13">
          <tspan x="20" dy="0">Gas furnace ignition fixes and</tspan>
          <tspan x="20" dy="20">cold-climate heat pump diagnostics.</tspan>
        </text>
        <text x="20" y="145" fill="#0F2238" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Learn More →</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(400, 215)">
        <rect width="370" height="190" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <rect x="20" y="20" width="36" height="36" rx="6" fill="#F8FAFC"/>
        <path d="M42 28L46 32L36 42" stroke="#1E293B" stroke-width="2"/>
        <text x="66" y="44" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Preventive Maintenance</text>
        <text x="20" y="76" fill="#475569" font-family="'Inter', sans-serif" font-size="13">
          <tspan x="20" dy="0">Seasonal 24-point tune-ups keeping</tspan>
          <tspan x="20" dy="20">power bills low and systems safe.</tspan>
        </text>
        <text x="20" y="145" fill="#0F2238" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Learn More →</text>
      </g>
    </g>
  </g>

  <!-- 6. Tablet Emergency CTA -->
  <g transform="translate(32, 1260)">
    <rect width="770" height="180" rx="12" fill="#DC2626"/>
    <g transform="translate(36, 36)">
      <text x="0" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800">Your HVAC Problem Can&apos;t Wait.</text>
      <text x="0" y="52" fill="#FEE2E2" font-family="'Inter', sans-serif" font-size="14">
        <tspan x="0" dy="0">Our emergency HVAC team is on call 24 hours a day</tspan>
        <tspan x="0" dy="22">with local service van radio dispatch.</tspan>
      </text>
      <g transform="translate(0, 75)">
        <rect width="240" height="46" rx="8" fill="#FFFFFF"/>
        <text x="120" y="28" fill="#DC2626" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" text-anchor="middle">Call (555) 014-7824</text>
      </g>
    </g>
  </g>

  <!-- 7. Tablet Footer -->
  <g transform="translate(0, 1500)">
    <rect width="834" height="380" fill="#0A1829"/>
    <g transform="translate(32, 40)">
      <text x="0" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">NorthStar HVAC Services</text>
      <text x="0" y="52" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Comfort You Can Count On • Tablet Viewport Artboard (834px)</text>
      <line x1="0" y1="90" x2="770" y2="90" stroke="#1E293B" stroke-width="1"/>
      <text x="0" y="130" fill="#64748B" font-family="'Inter', sans-serif" font-size="12">
        © 2026 NorthStar HVAC Services. Fictional business website UI design project.
      </text>
    </g>
  </g>
</svg>
