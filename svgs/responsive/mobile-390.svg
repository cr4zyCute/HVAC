<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 3200" width="390" height="3200" fill="none">
  <!-- NorthStar HVAC: MOBILE RESPONSIVE ARTBOARD (390px Viewport) -->
  <rect width="390" height="3200" fill="#F8FAFC"/>

  <!-- 1. Mobile Utility Bar -->
  <g id="Mobile-Utility-Bar" transform="translate(0, 0)">
    <rect width="390" height="36" fill="#0A1829"/>
    <circle cx="20" cy="18" r="3.5" fill="#EF4444"/>
    <text x="30" y="22" fill="#F87171" font-family="'Inter', sans-serif" font-size="10" font-weight="700">24/7 DISPATCH</text>
    <text x="240" y="22" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600">(555) 014-7824</text>
  </g>

  <!-- 2. Mobile Header Nav -->
  <g id="Mobile-Header" transform="translate(0, 36)">
    <rect width="390" height="68" fill="#FFFFFF"/>
    <line x1="0" y1="67.5" x2="390" y2="67.5" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Brand Logo -->
    <g transform="translate(16, 14)">
      <rect width="40" height="40" rx="8" fill="#0F2238"/>
      <path d="M20 8L22 17.5L32 20L22 22.5L20 32L18 22.5L8 20L18 17.5L20 8Z" fill="#FFFFFF"/>
      <circle cx="20" cy="20" r="2.5" fill="#E65100"/>
      <text x="48" y="24" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">NorthStar</text>
      <text x="122" y="24" fill="#E65100" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">HVAC</text>
    </g>

    <!-- Mobile Actions (Phone Icon + Hamburger) -->
    <g transform="translate(286, 14)">
      <!-- Phone Call Trigger (Official Lucide Phone) -->
      <rect width="40" height="40" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <svg x="10" y="10" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>

      <!-- Hamburger Menu (Official Lucide Menu) -->
      <g transform="translate(48, 0)">
        <rect width="40" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <svg x="10" y="10" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F2238" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" x2="20" y1="12" y2="12"/>
          <line x1="4" x2="20" y1="6" y2="6"/>
          <line x1="4" x2="20" y1="18" y2="18"/>
        </svg>
      </g>
    </g>
  </g>

  <!-- 3. Mobile Hero (Vertically Stacked) -->
  <g id="Mobile-Hero" transform="translate(16, 120)">
    <!-- Eyebrow Pill -->
    <rect width="250" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="12" cy="13" r="3.5" fill="#E65100"/>
    <text x="24" y="17" fill="#1E293B" font-family="'Inter', sans-serif" font-size="10" font-weight="600">RESIDENTIAL &amp; COMMERCIAL HVAC</text>

    <!-- Headline (Optimized for Mobile Readability) -->
    <text x="0" y="65" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="800">
      <tspan x="0" dy="0">Reliable HVAC Service</tspan>
      <tspan x="0" dy="38">When You Need It Most.</tspan>
    </text>

    <text x="0" y="155" fill="#475569" font-family="'Inter', sans-serif" font-size="15" font-weight="400">
      <tspan x="0" dy="0">From emergency heating repairs to AC system</tspan>
      <tspan x="0" dy="22">replacements, NorthStar keeps your home</tspan>
      <tspan x="0" dy="22">comfortable with upfront pricing.</tspan>
    </text>

    <!-- Full-Width Stacked CTA Buttons -->
    <g transform="translate(0, 235)">
      <!-- Primary -->
      <rect width="358" height="50" rx="8" fill="#E65100"/>
      <text x="179" y="31" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Book a Service</text>

      <!-- Secondary Call Direct -->
      <g transform="translate(0, 60)">
        <rect width="358" height="50" rx="8" fill="#FFFFFF" stroke="#0F2238" stroke-width="2"/>
        <text x="179" y="31" fill="#0F2238" font-family="'Inter', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Call (555) 014-7824</text>
      </g>
    </g>

    <!-- Rating Micro-Badge -->
    <g transform="translate(0, 370)">
      <rect width="358" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(16, 12)">
        <text x="0" y="24" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">4.9 / 5.0</text>
        <g transform="translate(76, 12)">
          <path d="M5 0L6.5 3.5L10 4L7.5 6.5L8 10L5 8L2 10L2.5 6.5L0 4L3.5 3.5L5 0Z" fill="#F59E0B"/>
          <path d="M15 0L16.5 3.5L20 4L17.5 6.5L18 10L15 8L12 10L12.5 6.5L10 4L13.5 3.5L15 0Z" fill="#F59E0B"/>
          <path d="M25 0L26.5 3.5L30 4L27.5 6.5L28 10L25 8L22 10L22.5 6.5L20 4L23.5 3.5L25 0Z" fill="#F59E0B"/>
          <path d="M35 0L36.5 3.5L40 4L37.5 6.5L38 10L35 8L32 10L32.5 6.5L30 4L33.5 3.5L35 0Z" fill="#F59E0B"/>
          <path d="M45 0L46.5 3.5L50 4L47.5 6.5L48 10L45 8L42 10L42.5 6.5L40 4L43.5 3.5L45 0Z" fill="#F59E0B"/>
        </g>
        <text x="145" y="24" fill="#64748B" font-family="'Inter', sans-serif" font-size="11">650+ Local Homeowners</text>
      </g>
    </g>
  </g>

  <!-- 4. Mobile Trust Signals (2x2 Compact Grid) -->
  <g id="Mobile-Trust" transform="translate(16, 580)">
    <rect width="170" height="64" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="12" y="26" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Licensed &amp; Insured</text>
    <text x="12" y="44" fill="#15803D" font-family="'Inter', sans-serif" font-size="11">• State Certified</text>

    <g transform="translate(188, 0)">
      <rect width="170" height="64" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="26" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">24/7 Emergency</text>
      <text x="12" y="44" fill="#DC2626" font-family="'Inter', sans-serif" font-size="11">• On-Call Dispatch</text>
    </g>
  </g>

  <!-- 5. Mobile Service Cards (1 Column Vertical Stack) -->
  <g id="Mobile-Services" transform="translate(16, 670)">
    <text x="0" y="16" fill="#E65100" font-family="'Inter', sans-serif" font-size="12" font-weight="700">OUR SERVICES</text>
    <text x="0" y="44" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">HVAC for Every Season</text>

    <!-- Card 1: AC Repair -->
    <g transform="translate(0, 65)">
      <rect width="358" height="150" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="16" y="16" width="36" height="36" rx="6" fill="#EFF6FF"/>
      <path d="M34 22V46M22 34H46" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
      <text x="64" y="38" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">AC Repair</text>
      <text x="16" y="72" fill="#475569" font-family="'Inter', sans-serif" font-size="13">
        <tspan x="16" dy="0">Fast diagnostics for warm air,</tspan>
        <tspan x="16" dy="20">strange noises, and coil leaks.</tspan>
      </text>
      <text x="16" y="122" fill="#0F2238" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Learn More →</text>
    </g>

    <!-- Card 2: Heating Repair -->
    <g transform="translate(0, 230)">
      <rect width="358" height="150" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="16" y="16" width="36" height="36" rx="6" fill="#FFF7ED"/>
      <path d="M34 24C34 24 29 29 29 33C29 35.8 31.2 38 34 38C36.8 38 39 35.8 39 33C39 29 34 24 34 24Z" stroke="#EA580C" stroke-width="2"/>
      <text x="64" y="38" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Heating &amp; Furnace Repair</text>
      <text x="16" y="72" fill="#475569" font-family="'Inter', sans-serif" font-size="13">
        <tspan x="16" dy="0">Reliable furnace ignition and</tspan>
        <tspan x="16" dy="20">blower fixes during freezing cold.</tspan>
      </text>
      <text x="16" y="122" fill="#0F2238" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Learn More →</text>
    </g>

    <!-- Card 3: 24/7 Emergency -->
    <g transform="translate(0, 395)">
      <rect width="358" height="150" rx="10" fill="#0F2238"/>
      <rect x="16" y="16" width="36" height="36" rx="6" fill="#DC2626" fill-opacity="0.2"/>
      <circle cx="34" cy="34" r="8" stroke="#EF4444" stroke-width="2"/>
      <text x="64" y="38" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">24/7 Emergency Dispatch</text>
      <text x="16" y="72" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">
        <tspan x="16" dy="0">Rapid arrival for complete</tspan>
        <tspan x="16" dy="20">system failure and freeze risk.</tspan>
      </text>
      <text x="16" y="122" fill="#F87171" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Request Emergency Call →</text>
    </g>
  </g>

  <!-- 6. Mobile Emergency CTA Bar -->
  <g id="Mobile-Emergency-CTA" transform="translate(16, 1260)">
    <rect width="358" height="180" rx="12" fill="#DC2626"/>
    <g transform="translate(20, 20)">
      <text x="0" y="20" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">HVAC Problem Can&apos;t Wait?</text>
      <text x="0" y="46" fill="#FEE2E2" font-family="'Inter', sans-serif" font-size="13">
        <tspan x="0" dy="0">Certified technicians on call</tspan>
        <tspan x="0" dy="20">across the metro region right now.</tspan>
      </text>
      <g transform="translate(0, 75)">
        <rect width="318" height="46" rx="8" fill="#FFFFFF"/>
        <text x="159" y="28" fill="#DC2626" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" text-anchor="middle">Tap to Call: (555) 014-7824</text>
      </g>
    </g>
  </g>

  <!-- 7. Mobile How It Works (Numbered) -->
  <g id="Mobile-Steps" transform="translate(16, 1480)">
    <text x="0" y="16" fill="#E65100" font-family="'Inter', sans-serif" font-size="12" font-weight="700">SIMPLE 3 STEPS</text>
    <text x="0" y="44" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">How It Works</text>

    <g transform="translate(0, 65)">
      <!-- Step 1 -->
      <rect width="358" height="85" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#0F2238"/>
      <text x="28" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">1</text>
      <text x="52" y="32" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Request Service</text>
      <text x="14" y="62" fill="#475569" font-family="'Inter', sans-serif" font-size="12">Book online or call our 24/7 line.</text>

      <!-- Step 2 -->
      <g transform="translate(0, 95)">
        <rect width="358" height="85" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <rect x="14" y="14" width="28" height="28" rx="6" fill="#E65100"/>
        <text x="28" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">2</text>
        <text x="52" y="32" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">We Diagnose</text>
        <text x="14" y="58" fill="#475569" font-family="'Inter', sans-serif" font-size="12">
          <tspan x="14" dy="0">Accurate testing with upfront</tspan>
          <tspan x="14" dy="18">flat-rate pricing guaranteed.</tspan>
        </text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 190)">
        <rect width="358" height="85" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <rect x="14" y="14" width="28" height="28" rx="6" fill="#15803D"/>
        <text x="28" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">3</text>
        <text x="52" y="32" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Get Comfortable</text>
        <text x="14" y="62" fill="#475569" font-family="'Inter', sans-serif" font-size="12">System fully restored and load-tested.</text>
      </g>
    </g>
  </g>

  <!-- 8. Mobile Footer -->
  <g id="Mobile-Footer" transform="translate(0, 1820)">
    <rect width="390" height="380" fill="#0A1829"/>
    <g transform="translate(20, 40)">
      <text x="0" y="20" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">NorthStar HVAC</text>
      <text x="0" y="44" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Comfort You Can Count On • Licensed &amp; Insured</text>
      <text x="0" y="80" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700">(555) 014-7824</text>
      <text x="0" y="104" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">hello@northstarhvac.example</text>
      
      <line x1="0" y1="130" x2="350" y2="130" stroke="#1E293B" stroke-width="1"/>
      <text x="0" y="160" fill="#64748B" font-family="'Inter', sans-serif" font-size="11">
        © 2026 NorthStar HVAC Services. Fictional mobile UI design. All rights reserved.
      </text>
    </g>
  </g>
</svg>
