<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" width="1440" height="320" fill="none">
  <!-- Section: Emergency CTA (Desktop 1440px) -->
  <g id="Emergency-CTA-Section">
    <!-- Deep Brand Navy Background with Subtle Warning Stripe -->
    <rect width="1440" height="320" fill="#0A1829"/>
    
    <!-- Accent Left Vertical Stripe -->
    <rect x="0" y="0" width="8" height="320" fill="#DC2626"/>

    <!-- Subtle Background Radial Sheen -->
    <circle cx="1300" cy="160" r="280" fill="#DC2626" fill-opacity="0.04"/>

    <g id="Content-Container" transform="translate(80, 50)">
      <!-- Urgent Status Tag -->
      <g id="Emergency-Pill">
        <rect width="170" height="28" rx="14" fill="#DC2626" fill-opacity="0.2"/>
        <circle cx="14" cy="14" r="4" fill="#EF4444"/>
        <text x="26" y="18" fill="#FCA5A5" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">24/7 RAPID RESPONSE</text>
      </g>

      <!-- Headline -->
      <text x="0" y="75" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800">Your HVAC Problem Can&apos;t Always Wait.</text>
      
      <!-- Subtext -->
      <text x="0" y="108" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="16" font-weight="400">
        <tspan x="0" dy="0">Our emergency HVAC team is on standby 24 hours a day</tspan>
        <tspan x="0" dy="24">for urgent furnace failures, AC breakdowns, and leaks.</tspan>
        <tspan x="0" dy="24">Fully stocked service trucks arrive ready to diagnose</tspan>
        <tspan x="0" dy="24">and restore your heating or cooling on the first visit.</tspan>
      </text>

      <!-- Dual Action Triggers -->
      <g id="Emergency-Actions" transform="translate(0, 165)">
        <!-- Primary Emergency CTA -->
        <g id="Btn-Emergency-Request">
          <rect width="250" height="52" rx="8" fill="#DC2626"/>
          <text x="125" y="32" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Request Emergency Service</text>
        </g>

        <!-- Secondary Call Now Button -->
        <g id="Btn-Call-Now" transform="translate(268, 0)">
          <rect width="210" height="52" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
          <g transform="translate(24, 14)" stroke="#F59E0B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/><path d="M14.05 2a9 9 0 0 1 8 7.94M14.05 6A5 5 0 0 1 18 10"/></g>
          <text x="122" y="32" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Call (555) 014-7824</text>
        </g>
      </g>
    </g>

    <!-- Right Side Emergency Stat Badge -->
    <g transform="translate(1040, 80)">
      <rect width="320" height="160" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <g transform="translate(30, 28)">
        <text x="0" y="24" fill="#F87171" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800">&lt; 45 Mins</text>
        <text x="0" y="52" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Average Emergency Response</text>
        <text x="0" y="78" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13" font-weight="400">
          <tspan x="0" dy="0">No surprise overtime fees on diagnostic</tspan>
          <tspan x="0" dy="18">calls. Direct radio dispatch.</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
