<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 120" width="1440" height="120" fill="none">
  <!-- Section: Trust Signals Bar (Desktop 1440px) -->
  <g id="Trust-Signals-Bar">
    <rect width="1440" height="120" fill="#FFFFFF"/>
    <line x1="0" y1="0.5" x2="1440" y2="0.5" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="0" y1="119.5" x2="1440" y2="119.5" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Trust Badge 1: Licensed & Insured -->
    <g id="Trust-Item-1" transform="translate(80, 32)">
      <rect width="52" height="52" rx="10" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="1"/>
      <g transform="translate(14, 14)" stroke="#16A34A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
        <path d="m9 12 2 2 4-4"/>
      </g>
      
      <text x="68" y="24" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Licensed &amp; Insured</text>
      <text x="68" y="42" fill="#64748B" font-family="'Inter', sans-serif" font-size="13" font-weight="400">Fully state licensed &amp; insured technicians</text>
    </g>

    <!-- Trust Badge 2: 24/7 Emergency Service -->
    <g id="Trust-Item-2" transform="translate(420, 32)">
      <rect width="52" height="52" rx="10" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="1"/>
      <g transform="translate(14, 14)" stroke="#DC2626" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </g>
      
      <text x="68" y="24" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">24/7 Emergency Service</text>
      <text x="68" y="42" fill="#64748B" font-family="'Inter', sans-serif" font-size="13" font-weight="400">Nights, weekends, &amp; holiday dispatch</text>
    </g>

    <!-- Trust Badge 3: 10+ Years Experience -->
    <g id="Trust-Item-3" transform="translate(760, 32)">
      <rect width="52" height="52" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(14, 14)" stroke="#0F2238" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="6"/>
        <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>
      </g>
      
      <text x="68" y="24" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">10+ Years in Service</text>
      <text x="68" y="42" fill="#64748B" font-family="'Inter', sans-serif" font-size="13" font-weight="400">Dedicated local heating &amp; cooling team</text>
    </g>

    <!-- Trust Badge 4: 100% Satisfaction Focused -->
    <g id="Trust-Item-4" transform="translate(1090, 32)">
      <rect width="52" height="52" rx="10" fill="#FFF7ED" stroke="#FFEDD5" stroke-width="1"/>
      <g transform="translate(14, 14)" stroke="#E65100" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 10v12M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2h0a3.13 3.13 0 0 1 3 3.88Z"/>
      </g>
      
      <text x="68" y="24" fill="#0F2238" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Satisfaction Focused</text>
      <text x="68" y="42" fill="#64748B" font-family="'Inter', sans-serif" font-size="13" font-weight="400">Clear communication &amp; upfront pricing</text>
    </g>
  </g>
</svg>


