<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 400" width="1440" height="400" fill="none">
  <!-- Section: Financing Promotion (Desktop 1440px) -->
  <g id="Financing-Section">
    <rect width="1440" height="400" fill="#FFFFFF"/>
    
    <g transform="translate(80, 50)">
      <!-- Main Container Card -->
      <rect width="1280" height="300" rx="16" fill="#0F2238"/>
      
      <!-- Subtle Decorative Waves -->
      <circle cx="1180" cy="150" r="220" fill="#1E3A5F" fill-opacity="0.3"/>

      <!-- Content -->
      <g transform="translate(60, 50)">
        <rect width="170" height="28" rx="14" fill="#1E3A5F"/>
        <text x="85" y="18" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">FLEXIBLE FINANCING</text>
        
        <text x="0" y="75" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800">Comfort Now. Flexible Payment Options.</text>
        
        <text x="0" y="108" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="16" font-weight="400">
          <tspan x="0" dy="0">Explore flexible monthly financing options for qualifying</tspan>
          <tspan x="0" dy="24">central air conditioners, heat pumps, and gas furnaces.</tspan>
          <tspan x="0" dy="24">Keep your household budget predictable and protected.</tspan>
        </text>

        <!-- CTA & Terms -->
        <g transform="translate(0, 160)">
          <!-- Primary CTA Button -->
          <g>
            <rect width="180" height="48" rx="8" fill="#E65100"/>
            <text x="90" y="29" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Explore Financing</text>
          </g>

          <!-- Disclaimer / Legal note -->
          <text x="210" y="30" fill="#64748B" font-family="'Inter', sans-serif" font-size="12">
            * Financing programs provided by authorized lending partners subject to credit approval. Terms vary.
          </text>
        </g>
      </g>
    </g>
  </g>
</svg>
