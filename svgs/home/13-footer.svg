<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 440" width="1440" height="440" fill="none">
  <!-- Section: Footer (Desktop 1440px) -->
  <g id="Footer-Section">
    <!-- Deep Brand Navy Background -->
    <rect width="1440" height="440" fill="#0A1829"/>

    <!-- Main Footer Grid (4 Columns) -->
    <g id="Footer-Columns" transform="translate(80, 70)">
      <!-- Col 1: Brand Info -->
      <g id="Col-Brand" transform="translate(0, 0)">
        <g id="Footer-Logo">
          <rect width="40" height="40" rx="8" fill="#1E3A5F"/>
          <path d="M20 8L22 17.5L32 20L22 22.5L20 32L18 22.5L8 20L18 17.5L20 8Z" fill="#FFFFFF"/>
          <circle cx="20" cy="20" r="2.5" fill="#E65100"/>
          <text x="50" y="23" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">NorthStar</text>
          <text x="135" y="23" fill="#E65100" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">HVAC</text>
        </g>
        
        <text x="0" y="70" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13" font-weight="400">
          <tspan x="0" dy="0">Comfort You Can Count On.</tspan>
          <tspan x="0" dy="22">Professional HVAC installation, repairs,</tspan>
          <tspan x="0" dy="22">maintenance, and emergency response</tspan>
          <tspan x="0" dy="22">for homes and businesses.</tspan>
        </text>

        <!-- Social Icons Row -->
        <g transform="translate(0, 160)">
          <!-- Facebook -->
          <circle cx="16" cy="16" r="16" fill="#1E293B"/>
          <path d="M18 13H16.5C15.7 13 15 13.7 15 14.5V16H18L17.5 19H15V26H12V19H10V16H12V14C12 11.8 13.8 10 16 10H18V13Z" fill="#94A3B8"/>
          <!-- LinkedIn -->
          <g transform="translate(42, 0)">
            <circle cx="16" cy="16" r="16" fill="#1E293B"/>
            <path d="M11 14H14V22H11V14ZM12.5 10C13.3 10 14 10.7 14 11.5C14 12.3 13.3 13 12.5 13C11.7 13 11 12.3 11 11.5C11 10.7 11.7 10 12.5 10ZM16 14H19V15.5H19.2C19.6 14.7 20.7 13.8 22 13.8C25 13.8 25.5 15.8 25.5 18.3V22H22.5V18.8C22.5 18 22.5 16.8 21.3 16.8C20.1 16.8 19.9 17.7 19.9 18.7V22H16.9V14H16Z" fill="#94A3B8"/>
          </g>
          <!-- Yelp -->
          <g transform="translate(84, 0)">
            <circle cx="16" cy="16" r="16" fill="#1E293B"/>
            <path d="M15 11L17 11L16 16L15 11ZM12 14L13.5 13L16 16.5L12 14ZM13 19L12 17.5L16.5 16.5L13 19ZM18 20L17 21L16.5 17L18 20ZM19 14.5L20 16L16.5 17L19 14.5Z" fill="#94A3B8"/>
          </g>
        </g>
      </g>

      <!-- Col 2: Navigation Links -->
      <g id="Col-Nav" transform="translate(360, 0)">
        <text x="0" y="16" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">COMPANY</text>
        <g transform="translate(0, 42)">
          <text x="0" y="0" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">Services Directory</text>
          <text x="0" y="28" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">About NorthStar</text>
          <text x="0" y="56" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">Service Areas</text>
          <text x="0" y="84" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">Financing Plans</text>
          <text x="0" y="112" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">Customer Reviews</text>
          <text x="0" y="140" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">Contact Us</text>
        </g>
      </g>

      <!-- Col 3: Services Links -->
      <g id="Col-Services" transform="translate(640, 0)">
        <text x="0" y="16" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">SERVICES</text>
        <g transform="translate(0, 42)">
          <text x="0" y="0" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">Air Conditioning Repair</text>
          <text x="0" y="28" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">AC Installation &amp; Replacement</text>
          <text x="0" y="56" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">Heating &amp; Furnace Repair</text>
          <text x="0" y="84" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">Preventive Maintenance Tune-up</text>
          <text x="0" y="112" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">Indoor Air Quality (IAQ)</text>
          <text x="0" y="140" fill="#F87171" font-family="'Inter', sans-serif" font-size="14" font-weight="600">24/7 Emergency Service</text>
        </g>
      </g>

      <!-- Col 4: Contact & Hours -->
      <g id="Col-Contact" transform="translate(940, 0)">
        <text x="0" y="16" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">DIRECT CONTACT</text>
        
        <g transform="translate(0, 42)">
          <text x="0" y="0" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="600">24/7 DISPATCH LINE</text>
          <text x="0" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700">(555) 014-7824</text>
          
          <text x="0" y="60" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="600">EMAIL SUPPORT</text>
          <text x="0" y="80" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">hello@northstarhvac.example</text>
          
          <text x="0" y="116" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="600">OPERATING HOURS</text>
          <text x="0" y="136" fill="#10B981" font-family="'Inter', sans-serif" font-size="13" font-weight="600">• Open 24 Hours / 7 Days a Week</text>
        </g>
      </g>
    </g>

    <!-- Bottom Copyright & Legal Line -->
    <g id="Footer-Bottom" transform="translate(80, 360)">
      <line x1="0" y1="0" x2="1280" y2="0" stroke="#1E293B" stroke-width="1"/>
      <text x="0" y="42" fill="#64748B" font-family="'Inter', sans-serif" font-size="12">
        © 2026 NorthStar HVAC Services. Fictional business website UI design project. All brand references and reviews are sample content.
      </text>
      
      <g transform="translate(920, 42)">
        <text x="0" y="0" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Privacy Policy</text>
        <text x="90" y="0" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Terms of Service</text>
        <text x="200" y="0" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Accessibility</text>
      </g>
    </g>
  </g>
</svg>
